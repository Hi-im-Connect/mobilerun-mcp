[project]
name = "mobilerun-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent see and control Android devices, including x86_64 redroid and emulators"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Salem" }]
keywords = ["mcp", "android", "adb", "redroid", "accessibility", "agents", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.0",
  "httpx>=0.27",
  "websockets>=13",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Hi-im-Connect/mobilerun-mcp"
Issues = "https://github.com/Hi-im-Connect/mobilerun-mcp/issues"

[project.scripts]
mobilerun-mcp = "mobilerun_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobilerun_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: needs the real device (run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# ruff format wraps code; docstrings and messages may run a little long
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mobilerun_mcp/browser/js.py" = ["UP031"]  # JavaScript snippets use %-templates
